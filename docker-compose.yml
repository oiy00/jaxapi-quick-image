# Standalone frontend only. Do NOT add this to the Sub2API compose file.
# Do not recreate or upgrade weishaw/sub2api. Production runs binary 0.2.24
# from a compose tag that still says 0.2.18; recreating that service is forbidden.
#
# Suggested path on the server: /opt/jaxapi-quick-image/docker-compose.yml
# Bind to localhost only. This file does not change Caddy and does not restore the menu.
# Caddy already proxies /image* to 127.0.0.1:43123.

services:
  jaxapi-quick-image:
    build:
      context: .
      dockerfile: Dockerfile
    image: jaxapi-quick-image:local
    container_name: jaxapi-quick-image
    restart: unless-stopped
    ports:
      - "127.0.0.1:43123:43123"
    environment:
      JAXAPI_BASE_URL: https://jaxapi.top
      NEXT_PUBLIC_BASE_PATH: /image
      NEXT_PUBLIC_API_MODE: same-origin
      SUPERGPT_BASE_URL: https://api.supergpt.dev/v1
      SUPERGPT_USER_AGENT: curl/8.5.0
      VIDEO_BILLING_ADAPTER: "off"
      VIDEO_JOB_STORE: /data/video-jobs.json
    volumes:
      - /opt/jaxapi-quick-image/data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:43123/image/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
